name: Sync Upstream, Obfuscate and Deploy to 4 Nodes

on:
  schedule:
    # 每天定时自动检查上游更新 (UTC 02:00 / 北京时间 10:00)
    - cron: '0 2 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '_worker.js'
      - '.github/workflows/deploy-nodes.yml'

jobs:
  sync-upstream:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      has_changes: ${{ steps.sync.outputs.has_changes }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync with Upstream
        id: sync
        run: |
          git remote add upstream https://github.com/cmliu/edgetunnel.git || true
          git fetch upstream main
          
          # 检查上游与当前仓库代码差异
          UPSTREAM_HASH=$(git rev-parse upstream/main)
          LOCAL_HASH=$(git rev-parse HEAD)
          echo "Upstream commit: $UPSTREAM_HASH"
          echo "Local commit: $LOCAL_HASH"
          
          # 合并上游更新并优先保留自身工作流配置
          git merge -X ours upstream/main -m "chore(sync): auto sync with upstream cmliu/edgetunnel" || true
          
          if [ -n "$(git status --porcelain)" ]; then
            git push origin main || true
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

  deploy:
    needs: sync-upstream
    if: always()
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node:
          - domain: "auto-cm-202610.206.dpdns.org"
            zone: "206.dpdns.org"
            secret_email_key: "CF_EMAIL_206"
            secret_key_key: "CF_KEY_206"
            secret_account_key: "CF_ACCOUNT_206"
            secret_kv_key: "CF_KV_ID_206"
          - domain: "auto-cm-202610.207.dpdns.org"
            zone: "207.dpdns.org"
            secret_email_key: "CF_EMAIL_207"
            secret_key_key: "CF_KEY_207"
            secret_account_key: "CF_ACCOUNT_207"
            secret_kv_key: "CF_KV_ID_207"
          - domain: "auto-cm-202610.208.dpdns.org"
            zone: "208.dpdns.org"
            secret_email_key: "CF_EMAIL_208"
            secret_key_key: "CF_KEY_208"
            secret_account_key: "CF_ACCOUNT_208"
            secret_kv_key: "CF_KV_ID_208"
          - domain: "auto-cm-202610.209.dpdns.org"
            zone: "209.dpdns.org"
            secret_email_key: "CF_EMAIL_209"
            secret_key_key: "CF_KEY_209"
            secret_account_key: "CF_ACCOUNT_209"
            secret_kv_key: "CF_KV_ID_209"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: |
          npm install -g wrangler javascript-obfuscator

      - name: Obfuscate and Protect Worker Code
        run: |
          cp _worker.js raw_source.js
          
          # 1. 拆分隐藏核心协议敏感特征词
          sed -i 's/"vless"/("vl"+"ess")/gI' raw_source.js
          sed -i "'s/'vless'/('vl'+'ess')/gI'" raw_source.js || true
          sed -i 's/"trojan"/("tr"+"ojan")/gI' raw_source.js
          sed -i "'s/'trojan'/('tr'+'ojan')/gI'" raw_source.js || true
          sed -i 's/"shadowsocks"/("ss"+"socks")/gI' raw_source.js || true
          
          # 2. 避免原代码中 const 变量重写 AST 冲突
          sed -i 's/\bconst\b/let/g' raw_source.js
          sed -i 's/const /let /g' raw_source.js
          
          # 3. 使用 javascript-obfuscator 二次深度加密，输出 edge-service 适配代码
          javascript-obfuscator raw_source.js \
            --output obfuscated_worker.js \
            --compact true \
            --control-flow-flattening true \
            --control-flow-flattening-threshold 0.5 \
            --numbers-to-expressions true \
            --simplify true \
            --string-array true \
            --string-array-encoding 'base64' \
            --string-array-threshold 0.8 \
            --split-strings true \
            --split-strings-chunk-length 5 \
            --transform-object-keys true

      - name: Resolve Node Credentials
        id: creds
        env:
          NODE_DATA: ${{ toJson(matrix.node) }}
        run: |
          # 动态匹配当前矩阵节点的 Secrets
          case "${{ matrix.node.zone }}" in
            "206.dpdns.org")
              echo "email=${{ secrets.CF_EMAIL_206 }}" >> $GITHUB_OUTPUT
              echo "key=${{ secrets.CF_KEY_206 }}" >> $GITHUB_OUTPUT
              echo "acc_id=${{ secrets.CF_ACCOUNT_206 }}" >> $GITHUB_OUTPUT
              echo "kv_id=${{ secrets.CF_KV_ID_206 }}" >> $GITHUB_OUTPUT
              ;;
            "207.dpdns.org")
              echo "email=${{ secrets.CF_EMAIL_207 }}" >> $GITHUB_OUTPUT
              echo "key=${{ secrets.CF_KEY_207 }}" >> $GITHUB_OUTPUT
              echo "acc_id=${{ secrets.CF_ACCOUNT_207 }}" >> $GITHUB_OUTPUT
              echo "kv_id=${{ secrets.CF_KV_ID_207 }}" >> $GITHUB_OUTPUT
              ;;
            "208.dpdns.org")
              echo "email=${{ secrets.CF_EMAIL_208 }}" >> $GITHUB_OUTPUT
              echo "key=${{ secrets.CF_KEY_208 }}" >> $GITHUB_OUTPUT
              echo "acc_id=${{ secrets.CF_ACCOUNT_208 }}" >> $GITHUB_OUTPUT
              echo "kv_id=${{ secrets.CF_KV_ID_208 }}" >> $GITHUB_OUTPUT
              ;;
            "209.dpdns.org")
              echo "email=${{ secrets.CF_EMAIL_209 }}" >> $GITHUB_OUTPUT
              echo "key=${{ secrets.CF_KEY_209 }}" >> $GITHUB_OUTPUT
              echo "acc_id=${{ secrets.CF_ACCOUNT_209 }}" >> $GITHUB_OUTPUT
              echo "kv_id=${{ secrets.CF_KV_ID_209 }}" >> $GITHUB_OUTPUT
              ;;
          esac

      - name: Generate wrangler.toml
        run: |
          cat << 'EOF' > wrangler.toml
          name = "auto-cm-202610"
          main = "obfuscated_worker.js"
          compatibility_date = "2026-01-20"

          [vars]
          ADMIN = "${{ secrets.VAR_ADMIN }}"
          UUID = "${{ secrets.VAR_UUID }}"
          URL = "${{ secrets.VAR_URL }}"
          BEST_SUB = "${{ secrets.VAR_BEST_SUB }}"
          TCP_CONCURRENT_DIAL = "${{ secrets.VAR_TCP_CONCURRENT_DIAL }}"
          PROXY_CONCURRENT_DIAL = "${{ secrets.VAR_PROXY_CONCURRENT_DIAL }}"

          [[kv_namespaces]]
          binding = "KV"
          id = "${{ steps.creds.outputs.kv_id }}"

          [[routes]]
          pattern = "${{ matrix.node.domain }}"
          custom_domain = true
          zone_name = "${{ matrix.node.zone }}"
          EOF

      - name: Deploy to Cloudflare Worker
        env:
          CLOUDFLARE_API_KEY: ${{ steps.creds.outputs.key }}
          CLOUDFLARE_EMAIL: ${{ steps.creds.outputs.email }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.creds.outputs.acc_id }}
        run: |
          npx wrangler deploy --minify
