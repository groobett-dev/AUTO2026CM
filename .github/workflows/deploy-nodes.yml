name: Sync Upstream, Obfuscate and Deploy to 4 Nodes

on:
  schedule:
    # 每天定时自动检查上游更新 (UTC 02:00 / 北京时间 10:00)
    - cron: '0 2 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-nodes.yml'

jobs:
  sync_upstream:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      has_changes: ${{ steps.sync.outputs.has_changes }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check and Sync with Upstream
        id: sync
        run: |
          # 1. 检查 upstream 是否存在并获取最新 main
          git remote add upstream https://github.com/cmliu/edgetunnel.git || git remote set-url upstream https://github.com/cmliu/edgetunnel.git
          git fetch upstream main --depth=10

          UPSTREAM_HEAD=$(git rev-parse upstream/main)
          echo "Upstream HEAD: $UPSTREAM_HEAD"

          # 记录上次同步的上游 commit SHA
          LAST_SYNCED=""
          if [ -f .last_upstream_sha ]; then
            LAST_SYNCED=$(cat .last_upstream_sha)
          fi
          echo "Last Synced SHA: $LAST_SYNCED"

          # 判断是否有更新或为手动触发
          if [ "$UPSTREAM_HEAD" != "$LAST_SYNCED" ] || [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "Changes detected or manual trigger! Extracting upstream _worker.js..."
            git checkout upstream/main -- _worker.js || git show upstream/main:_worker.js > _worker.js

            python scripts/transform.py _worker.js _worker.js
            echo "$UPSTREAM_HEAD" > .last_upstream_sha

            git add _worker.js .last_upstream_sha
            git commit -m "chore(sync): auto sync with upstream cmliu/edgetunnel and apply Chinese transformation" || true
            git push origin main || true
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "No upstream changes. Upstream is in sync."
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

  deploy:
    needs: sync_upstream
    # 仅在手动触发、或检查到上游更新 (has_changes == 'true') 时才触发部署
    if: github.event_name == 'workflow_dispatch' || needs.sync_upstream.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node:
          - domain: "auto-cm-202610.206.dpdns.org"
            zone: "206.dpdns.org"
          - domain: "auto-cm-202610.207.dpdns.org"
            zone: "207.dpdns.org"
          - domain: "auto-cm-202610.208.dpdns.org"
            zone: "208.dpdns.org"
          - domain: "auto-cm-202610.209.dpdns.org"
            zone: "209.dpdns.org"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Wrangler
        run: |
          npm install -g wrangler

      - name: Resolve Node Credentials
        id: creds
        run: |
          case "${{ matrix.node.zone }}" in
            "206.dpdns.org")
              echo "email=${{ secrets.CF_EMAIL_206 }}" >> $GITHUB_OUTPUT
              echo "key=${{ secrets.CF_KEY_206 }}" >> $GITHUB_OUTPUT
              echo "acc_id=${{ secrets.CF_ACCOUNT_206 }}" >> $GITHUB_OUTPUT
              echo "kv_id=${{ secrets.CF_KV_ID_206 }}" >> $GITHUB_OUTPUT
              ;;
            "207.dpdns.org")
              echo "email=${{ secrets.CF_EMAIL_207 }}" >> $GITHUB_OUTPUT
              echo "key=${{ secrets.CF_KEY_207 }}" >> $GITHUB_OUTPUT
              echo "acc_id=${{ secrets.CF_ACCOUNT_207 }}" >> $GITHUB_OUTPUT
              echo "kv_id=${{ secrets.CF_KV_ID_207 }}" >> $GITHUB_OUTPUT
              ;;
            "208.dpdns.org")
              echo "email=${{ secrets.CF_EMAIL_208 }}" >> $GITHUB_OUTPUT
              echo "key=${{ secrets.CF_KEY_208 }}" >> $GITHUB_OUTPUT
              echo "acc_id=${{ secrets.CF_ACCOUNT_208 }}" >> $GITHUB_OUTPUT
              echo "kv_id=${{ secrets.CF_KV_ID_208 }}" >> $GITHUB_OUTPUT
              ;;
            "209.dpdns.org")
              echo "email=${{ secrets.CF_EMAIL_209 }}" >> $GITHUB_OUTPUT
              echo "key=${{ secrets.CF_KEY_209 }}" >> $GITHUB_OUTPUT
              echo "acc_id=${{ secrets.CF_ACCOUNT_209 }}" >> $GITHUB_OUTPUT
              echo "kv_id=${{ secrets.CF_KV_ID_209 }}" >> $GITHUB_OUTPUT
              ;;
          esac

      - name: Generate wrangler.toml
        run: |
          cat << 'EOF' > wrangler.toml
          name = "auto-cm-202610"
          main = "_worker.js"
          compatibility_date = "2026-01-20"
          workers_dev = false

          [vars]
          ADMIN = "${{ secrets.VAR_ADMIN }}"
          UUID = "${{ secrets.VAR_UUID }}"
          URL = "${{ secrets.VAR_URL }}"
          BEST_SUB = "${{ secrets.VAR_BEST_SUB }}"
          TCP_CONCURRENT_DIAL = "${{ secrets.VAR_TCP_CONCURRENT_DIAL }}"
          PROXY_CONCURRENT_DIAL = "${{ secrets.VAR_PROXY_CONCURRENT_DIAL }}"
          PROXYIP = "${{ secrets.VAR_PROXYIP || 'proxyip.cmliussss.net,cf.090227.xyz' }}"

          [[kv_namespaces]]
          binding = "KV"
          id = "${{ steps.creds.outputs.kv_id }}"

          [[routes]]
          pattern = "${{ matrix.node.domain }}"
          custom_domain = true
          zone_name = "${{ matrix.node.zone }}"
          EOF

      - name: Deploy to Cloudflare Worker
        env:
          CLOUDFLARE_API_KEY: ${{ steps.creds.outputs.key }}
          CLOUDFLARE_EMAIL: ${{ steps.creds.outputs.email }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.creds.outputs.acc_id }}
        run: |
          npx wrangler deploy --minify
